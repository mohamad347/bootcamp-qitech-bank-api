name: bootcamp-qitech-bank-api-tests

services:
  db_test:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp_test"]
      interval: 3s
      timeout: 3s
      retries: 20

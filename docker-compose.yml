services:
  api:
    build:
      context: .
      target: api
    image: bootcamp-qitech-bank-api:local
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-api}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_URL: ${BANKSLIP_API_URL:-http://localhost:8080}
      BANKSLIP_API_INTERNAL_TOKEN: ${BANKSLIP_API_INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_TIMEOUT: ${BANKSLIP_API_TIMEOUT:-5}
      ANALYSIS_PROVIDER_URL: ${ANALYSIS_PROVIDER_URL:-http://mockserver:1080}
      ANALYSIS_PROVIDER_TIMEOUT: ${ANALYSIS_PROVIDER_TIMEOUT:-5}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      mockserver:
        condition: service_healthy

  db:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  mockserver:
    build: ./mockserver
    image: bootcamp-qitech-bank-api-mockserver:local
    environment:
      MOCKSERVER_LOG_LEVEL: ${MOCKSERVER_LOG_LEVEL:-WARN}
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/analysis-provider-initialization.json
      MOCKSERVER_FAIL_ON_INITIALIZATION_ERROR: "true"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://localhost:1080/mockserver/ready"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  api_test:
    build:
      context: .
      target: api
    image: bootcamp-qitech-bank-api:local
    ports:
      - "127.0.0.1:${API_TEST_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db_api_test:5432/bootcamp
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      APP_ENV: test
      SERVICE_NAME: bootcamp-api-test
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_URL: ${BANKSLIP_API_URL:-http://localhost:8080}
      BANKSLIP_API_INTERNAL_TOKEN: ${BANKSLIP_API_INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_TIMEOUT: ${BANKSLIP_API_TIMEOUT:-5}
      ANALYSIS_PROVIDER_URL: ${ANALYSIS_PROVIDER_TEST_URL:-http://mockserver_test:1080}
      ANALYSIS_PROVIDER_TIMEOUT: ${ANALYSIS_PROVIDER_TIMEOUT:-5}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db_api_test:
        condition: service_healthy
      mockserver_test:
        condition: service_healthy

  db_api_test:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      - "127.0.0.1:${API_TEST_DB_PORT:-55433}:5432"
    volumes:
      - db_api_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  db_schema_test:
    build: ./database
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp_schema_test
    ports:
      - "127.0.0.1:${SCHEMA_TEST_DB_PORT:-55432}:5432"
    volumes:
      - db_schema_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp_schema_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  mockserver_test:
    build: ./mockserver
    image: bootcamp-qitech-bank-api-mockserver:local
    ports:
      - "127.0.0.1:${MOCKSERVER_TEST_PORT:-1081}:1080"
    environment:
      MOCKSERVER_LOG_LEVEL: ${MOCKSERVER_LOG_LEVEL:-WARN}
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://localhost:1080/mockserver/ready"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  db_data:
  db_api_test_data:
  db_schema_test_data:
